<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야구 드래프트 모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07163a;--pn:#0d2455;--bd:#2f5fc4;--tx:#eaf1ff;--mut:#8fa8d8;--ac:#38bdf8;--ok:#4ade80;--bad:#f87171;--okt:#052;color-scheme:dark light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8efff;--pn:#fff;--bd:#7aa2ee;--tx:#10224d;--mut:#5a6f9c;--ac:#0369a1;--ok:#15803d;--bad:#b91c1c;--okt:#fff}}
:root[data-theme="light"]{--bg:#e8efff;--pn:#fff;--bd:#7aa2ee;--tx:#10224d;--mut:#5a6f9c;--ac:#0369a1;--ok:#15803d;--bad:#b91c1c;--okt:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 12px 90px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}.hd h1{flex:1;font-size:20px;margin:0;font-style:italic;font-weight:800}.hd small{display:block;font-size:11px;font-weight:400;font-style:normal;color:var(--mut)}
.pill{border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:10px;padding:5px 10px;font-size:12px;text-align:center;font-weight:700}
button{font:inherit;cursor:pointer}.bk{border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:10px;padding:6px 12px;font-size:18px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;max-width:100%}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.sm div{border:1px solid var(--bd);background:var(--pn);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mut)}.sm small{display:block;margin-top:4px;font-size:11px;font-weight:600}.sm .nr{color:var(--ok)}.sm b{display:block;font-size:34px;line-height:1.1;color:var(--tx);font-style:italic;font-weight:800}.sm .w b{color:var(--ac)}
.ms{border:1px solid var(--bd);background:var(--pn);border-radius:14px;padding:10px;margin-bottom:12px}.ms h3{margin:0 0 8px;font-size:14px}
.mg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.mi{border:1px solid var(--bd);border-radius:8px;padding:5px;text-align:center;font-size:11px;min-height:58px;display:flex;flex-direction:column;justify-content:space-between}
.mi{position:relative}.dfs{display:flex;gap:6px;margin-bottom:10px;align-items:center;font-size:12px;color:var(--mut)}.mi b{display:block;border-radius:5px;background:rgba(80,130,230,.25);font-size:13px;padding:2px}.mi.ok b{background:var(--ok);color:var(--okt)}
.gr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gr4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cd{min-width:0;border:1px solid var(--bd);border-radius:12px;background:var(--pn);cursor:pointer;position:relative;padding:6px 6px 0}.cd.sel{outline:3px solid var(--ok);transform:translateY(-2px)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px 0;text-align:center;font-size:10px;color:var(--mut)}.sg b{display:block;font-size:14px;color:var(--tx)}.sg .hi b{color:var(--ok)}.sg .vl b{color:var(--ac)}
.inf{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);text-align:center;padding:3px 0 0}

function openPos(q){if(S.r[q])return;S.pos=q;S.c=mkc(cd(q));S.sel=-1;S.t=30;S.view="pick";clearInterval(TI);TI=setInterval(tick,1000);draw()}
function tick(){S.t--;if(S.t<=0){S.sel=S.c.indexOf(S.c.slice().sort((a,b)=>b.o-a.o)[0]);confirmPick();return}const e=document.getElementById("tm");if(e)e.textContent="00:"+String(S.t).padStart(2,"0")}
function choose(i){S.sel=i;draw()}
function confirmPick(){if(S.sel<0)return;clearInterval(TI);S.r[S.pos]=S.c[S.sel];S.view=cnt()==N?"end":"lineup";if(S.view=="end")saveBest(list());draw()}
function back(){clearInterval(TI);S.view="lineup";draw()}
let BS={N:{o:0,w:0,n:0},H:{o:0,w:0,n:0}};try{const j=JSON.parse(localStorage.getItem("bbd_best2"));if(j)BS={N:Object.assign(BS.N,j.N),H:Object.assign(BS.H,j.H)}}catch(e){}
function saveBest(l){const B=BS[DF],o=Math.round(l.reduce((s,p)=>s+p.o,0)/l.length),w=Math.round(l.reduce((s,p)=>s+p.WAR,0)*10)/10;S.nr={o:o>B.o,w:w>B.w};BS[DF]={o:Math.max(B.o,o),w:Math.max(B.w,w),n:B.n+1};try{localStorage.setItem("bbd_best2",JSON.stringify(BS))}catch(e){}}
function sum(l){const n=l.length,av=n?Math.round(l.reduce((s,p)=>s+p.o,0)/n):"-",w=l.reduce((s,p)=>s+p.WAR,0),e=S.view=="end"&&S.nr||{};return'<div class="sm"><div>팀 평균 OVR<b>'+av+'</b><small class="'+(e.o?"nr":"")+'">'+(e.o?"🏆 신기록! · ":"")+DN[DF]+' 역대 최고 '+(BS[DF].n?BS[DF].o:"-")+'</small></div><div class="w">선수 WAR 합계<b>'+w.toFixed(1)+'</b><small class="'+(e.w?"nr":"")+'">'+(e.w?"🏆 신기록! · ":"")+DN[DF]+' 역대 최고 '+(BS[DF].n?BS[DF].w.toFixed(1):"-")+'</small></div></div>'}

const pw=p=>p.k=="B"?p.st[0][1]:0,MT=[
{k:"team",t:g=>"같은 팀 선수 "+g+"명 이상",f:sameTeam,g:[4,5]},
{k:"teams",t:g=>"서로 다른 팀 "+g+"개 이상",f:l=>new Set(l.map(p=>p.ti)).size,g:[8,10]},
{k:"avg",t:g=>"타율 .300↑ 타자 "+g+"명",f:l=>l.filter(p=>p.AVG>=.3).length,g:[3,4]},
{k:"hr",t:g=>"25홈런↑ 타자 "+g+"명",f:l=>l.filter(p=>p.HR>=25).length,g:[2,3]},
{k:"sb",t:g=>"20도루↑ 타자 "+g+"명",f:l=>l.filter(p=>p.SB>=20).length,g:[2,3]},
{k:"wrc",t:g=>"wRC+ 130↑ 타자 "+g+"명",f:l=>l.filter(p=>p.wrc>=130).length,g:[3,4]},
{k:"pow",t:g=>"파워 85↑ 타자 "+g+"명",f:l=>l.filter(p=>pw(p)>=85).length,g:[3,4]},
{k:"spd",t:g=>"주루 80↑ 타자 "+g+"명",f:l=>l.filter(p=>p.k=="B"&&p.st[3][1]>=80).length,g:[3,4]},
{k:"eye",t:g=>"선구안 85↑ 타자 "+g+"명",f:l=>l.filter(p=>p.k=="B"&&p.st[2][1]>=85).length,g:[3,4]},
{k:"era",t:g=>"ERA 3.00↓ 투수 "+g+"명",f:l=>l.filter(p=>p.k=="P"&&p.ERA<=3&&p.IP>=30).length,g:[3,4]},
{k:"whip",t:g=>"WHIP 1.20↓ 투수 "+g+"명",f:l=>l.filter(p=>p.k=="P"&&p.WHIP<=1.2).length,g:[3,4]},
{k:"stuff",t:g=>"구위 85↑ 투수 "+g+"명",f:l=>l.filter(p=>p.k=="P"&&p.st[0][1]>=85).length,g:[2,3]},
{k:"war5",t:g=>"WAR 5.0↑ 선수 "+g+"명",f:l=>l.filter(p=>p.WAR>=5).length,g:[2,3]},
{k:"elite",t:g=>"엘리트(보라) 카드 "+g+"장",f:l=>l.filter(p=>p.WAR>4).length,g:[3,5]},
{k:"ovr",t:g=>"팀 평균 OVR "+g+" 이상",f:l=>l.length?l.reduce((s,p)=>s+p.o,0)/l.length:0,g:[74,80],fin:1,dec:0},
{k:"wsum",t:g=>"선수 WAR 합계 "+g+" 이상",f:l=>l.reduce((s,p)=>s+p.WAR,0),g:[20,30],fin:1,dec:1}];
let DF="N";try{DF=localStorage.getItem("bbd_df")=="H"?"H":"N"}catch(e){}
const DN={N:"보통",H:"어려움"},gv=(t,d)=>t.g[d=="H"?1:0];
const ELIG={};POS.forEach(q=>{const c=cd(q);ELIG[q]=PL.filter(p=>c=="DH"?p.k=="B":c=="CP"?(p.pos=="CP"||p.pos=="RP"):p.pos==c)});
const mval=(m,l)=>m.f(l),mok=(m,l)=>mval(m,l)>=m.g&&(!m.fin||l.length==N);
function solvable(ms,fixed){const fq=POS.filter(q=>fixed[q]),em=POS.filter(q=>!fixed[q]),ud=new Set(fq.map(q=>fixed[q].id));
 const sc=l=>ms.reduce((s,m)=>s+Math.min(1,Math.max(0,m.f(l)/m.g)),0);
 for(let rs=0;rs<6;rs++){const cur={...fixed},u=new Set(ud);
  for(const q of em){let p;do{p=pk(ELIG[q])}while(u.has(p.id));cur[q]=p;u.add(p.id)}
  let s=sc(Object.values(cur));
  for(let it=0;it<2500&&s<ms.length-1e-9;it++){if(!em.length)break;const q=pk(em),o=cur[q],p=pk(ELIG[q]);if(u.has(p.id))continue;cur[q]=p;const s2=sc(Object.values(cur));if(s2>=s){u.delete(o.id);u.add(p.id);s=s2}else cur[q]=o}
  if(s>=ms.length-1e-9)return true;if(!em.length)return false}
 return false}
function inst(t){return{k:t.k,t:t.t,f:t.f,fin:t.fin,dec:t.dec||0,g:gv(t,DF),i:MT.indexOf(t)}}
function drawMissions(fixed){for(let a=0;a<60;a++){const ms=shuf(MT).slice(0,6).map(inst);if(solvable(ms,fixed||{}))return ms}return shuf(MT).slice(0,6).map(inst)}
function setDF(d){if(cnt()>0||DF==d)return;DF=d;try{localStorage.setItem("bbd_df",d)}catch(e){}S.m=drawMissions({});draw()}
function mis(l){return'<div class="ms"><h3>🎯 MISSION <small style="font-weight:400;color:var(--mut)">'+DN[DF]+' 난이도'+'</small></h3>'+(S.msg?'<div style="color:var(--bad);font-size:12px;margin-bottom:6px">'+S.msg+'</div>':'')+'<div class="mg">'+S.m.map((m,i)=>{const v=mval(m,l),ok=mok(m,l),vs=m.fin?(l.length?v.toFixed(m.dec):"-"):v;return'<div class="mi '+(ok?"ok":"")+'">'+'<span>'+m.t(m.g)+'</span><b>'+vs+' / '+m.g+'</b></div>'}).join("")+'</div></div>'}
function stats(p){return'<div class="sg">'+p.st.map(x=>'<div class="'+(x[2]?"vl":x[1]>=80?"hi":"")+'"><b>'+x[1]+'</b>'+x[0]+'</div>').join("")+'</div>'}
function tile(p){return'<div class="tl" style="'+layers(p)+'"><span class="tn">'+String(p.y).slice(2)+' '+p.n+'</span><span class="tp">'+pl(p.pos)+'</span><span class="th">'+p.o+'</span></div>'}
function card(p,i){return'<div class="cd'+(S.sel==i?" sel":"")+'" onclick="choose('+i+')">'+tile(p)+'<div class="inf">'+p.tm+' · '+p.i+'</div>'+stats(p)+'</div>'}
function field(){return'<div class="field">'+POS.map(q=>'<div class="sl" style="left:'+XY[q][0]+'%;top:'+XY[q][1]+'%">'+(S.r[q]?tile(S.r[q]):'<div class="em" onclick="openPos(\''+q+'\')">'+'<span class="pt">'+cd(q)+'</span>'+(LB[cd(q)]?'<small>'+LB[cd(q)]+'</small>':"")+'</div>')+'</div>').join("")+'</div>'}
const GI=[[3,"노말","WAR 1 이하","20%","#2f7fe0"],[0,"레어","WAR 2 초과 ~ 4 이하","20%","#e0243f"],[4,"스페셜","WAR 1 초과 ~ 2 이하","50%","#e0841e"],[1,"엘리트","WAR 4 초과","10%","#6a2bd0"]].sort((a,b)=>[3,4,0,1].indexOf(a[0])-[3,4,0,1].indexOf(b[0]));
const LC={};function lcard(x){return LC[x.id]||(LC[x.id]=Object.assign({},x,{y:2026,g:gradeOf(x.WAR),sl:pk(x.k=="P"?TEAMS[x.ti].pit:TEAMS[x.ti].bat),bg:pickBg(gradeOf(x.WAR))}))}
function openList(){clearInterval(TI);S.view="list";S.lg=S.lg==null?-1:S.lg;S.lk=S.lk||"A";draw()}
function listView(){const gp=[[-1,"전체"]].concat(GI.map(g=>[g[0],g[1]])),kp=[["A","전체"],["B","타자"],["P","투수"]];
 const rows=PL.filter(p=>(S.lg<0||gradeOf(p.WAR)==S.lg)&&(S.lk=="A"||p.k==S.lk)).sort((a,b)=>b.WAR-a.WAR);
 return'<div class="hd"><button class="bk" onclick="back()">←</button><h1>카드 목록<small>카드 색이 등급이에요 · WAR 기준</small></h1></div><div class="ms"><h3>등급 안내 <small style="font-weight:400;color:var(--mut)">(등장 확률)</small></h3>'+GI.map(g=>'<div class="gl"><i style="background:'+g[4]+'"></i><b>'+g[1]+'</b><span>'+g[2]+'</span><em>'+g[3]+'</em></div>').join("")+'<div class="gl"><i style="background:#d4a514"></i><b>레전드</b><span>준비 중</span><em>-</em></div></div>'
 +'<div class="ctl">'+gp.map(g=>'<button class="pill'+(S.lg==g[0]?" on":"")+'" onclick="S.lg='+g[0]+';draw()">'+g[1]+'</button>').join("")+'</div><div class="ctl">'+kp.map(g=>'<button class="pill'+(S.lk==g[0]?" on":"")+'" onclick="S.lk=\''+g[0]+'\';draw()">'+g[1]+'</button>').join("")+'<span style="font-size:12px;color:var(--mut)">'+rows.length+'명</span></div><div class="gr4">'+rows.map(p=>{const c=lcard(p);return'<div class="lc">'+tile(c)+'<div class="lw">'+(p.k=="P"?p.pos:p.pos)+' · WAR '+p.WAR.toFixed(1)+'</div></div>'}).join("")+'</div>'}
function restart(){if(cnt()>0&&!S.cf){S.cf=1;draw();const s=S;setTimeout(()=>{if(S===s&&S.cf){S.cf=0;draw()}},3000);return}init()}
const RB=()=>'<span class="bb"><button class="rs'+(S.cf?" cf":"")+'" onclick="restart()">'+(S.cf?"정말요?":"↺ 다시시작")+'</button>';
function draw(){const l=list(),bar=document.getElementById("bar");let h;bar.style.display=S.view=="list"?"none":"block";
 if(S.view=="pick"){h='<div class="hd"><button class="bk" onclick="back()">←</button><h1>DRAFT MODE ⚾<small>'+(LB[cd(S.pos)]||cd(S.pos))+' 후보 중에서 선택하세요</small></h1><div class="pill">ROUND '+rd()+' / 5</div><div class="pill">⏱ <span id="tm">00:'+String(S.t).padStart(2,"0")+'</span></div></div>'+sum(l)+mis(l)+'<div class="gr">'+S.c.map(card).join("")+'</div>';
  bar.innerHTML='<div><span>선택한 선수 <b style="font-size:22px">'+cnt()+' / '+N+'</b></span>'+RB()+'<button class="go" '+(S.sel<0?"disabled":"")+' onclick="confirmPick()">✔ 선택하기</button></span></div>'}
 else if(S.view=="list"){h=listView()}
 else if(S.view=="end"){const ok=S.m.filter(m=>mok(m,l)).length,av=Math.round(l.reduce((s,p)=>s+p.o,0)/N);
  h='<div class="hd"><h1>DRAFT 완료 🎉<small>미션 '+ok+' / 6 클리어 · 팀 평균 '+av+'</small></h1></div>'+sum(l)+field()+'<div style="height:12px"></div>'+mis(l);bar.innerHTML='<div><span></span><button class="go" onclick="init()">다시 하기</button></div>'}
 else{h='<div class="hd"><h1>DRAFT MODE ⚾<small>포지션을 눌러 해당 포지션 선수 중에서 뽑으세요</small></h1><div class="pill">ROUND '+rd()+' / 5</div><button class="pill" onclick="openList()">카드 목록</button></div><div class="dfs">난이도'+["N","H"].map(d=>'<button class="pill'+(DF==d?" on":"")+'" '+(cnt()>0&&DF!=d?"disabled style=\'opacity:.4\'":"")+' onclick="setDF(\''+d+'\')">'+DN[d]+'</button>').join("")+(cnt()>0?'<span>드래프트 중에는 변경할 수 없어요</span>':'')+'</div>'+sum(l)+field()+'<div style="height:12px"></div>'+mis(l);bar.innerHTML='<div><span>선택한 선수 <b style="font-size:22px">'+cnt()+' / '+N+'</b></span>'+RB()+'<button class="go" disabled>✔ 선택하기</button></span></div>'}
 document.getElementById("app").innerHTML=h}
init();
</script></body></html>
